[project]
name = "travel-agent-api"
version = "0.1.0"
description = "Assistente di viaggio intelligente basato su FastAPI, LangChain e LangGraph"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = ["fastapi (>=0.142.2,<0.143.0)", "uvicorn (>=0.54.0,<0.55.0)", "openai (>=3.25.0,<4.0.0)", "langchain-openai (>=1.6.7,<2.0.0)", "langchain-community (>=0.4.2,<0.5.0)", "langgraph (>=1.2.14,<2.0.0)", "pydantic (>=2.13.5,<3.0.0)", "python-dotenv (>=1.2.4,<2.0.0)", "google-search-results (>=2.4.2,<3.0.0)", "langchain-ollama (>=1.1.0,<2.0.0)"]

[tool.poetry]
packages = [{include = "travel_agent_api"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
